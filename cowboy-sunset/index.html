<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Cowboy Sunset — Seamless Loop</title>
  <link rel="preload" as="image" href="assets/desert-town.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Inline critical styles to prevent FOUC; rest in styles.css */
    html, body { height: 100%; }
    body { margin: 0; background: #0b0b0b; }
  </style>
  <!-- SVG defs live here so filters are globally accessible -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Heat shimmer: subtle refractive displacement that loops -->
      <filter id="heatShimmer" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="4;7;4" dur="6s" repeatCount="indefinite"/>
        </feDisplacementMap>
      </filter>
      <!-- Soft sun glow -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFD27A"/>
        <stop offset="60%" stop-color="#FFB347"/>
        <stop offset="100%" stop-color="#F8763D"/>
      </radialGradient>
    </defs>
  </svg>
</head>
<body>
  <main class="scene" aria-label="Cartoon western sunset town looping animation">
    <!-- Static background image -->
    <div class="backdrop" role="img" aria-label="Desert town at sunset"></div>

    <!-- Sun: will move subtly down and reset seamlessly -->
    <svg class="sun" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="100" cy="100" r="70" fill="url(#sunGlow)" />
    </svg>

    <!-- Clouds: multiple layers for parallax drift -->
    <div class="clouds">
      <div class="cloud layer a"></div>
      <div class="cloud layer b"></div>
      <div class="cloud layer c"></div>
    </div>

    <!-- Foreground sway targets (vector silhouettes) -->
    <div class="sway-layer">
      <svg viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g class="sway a" fill="#2d5f45">
          <path d="M80 180 c-4 -20 6 -45 14 -60 8 -15 10 -30 5 -40 -5 -10 10 -12 15 0 6 12 6 26 0 40 -6 14 -4 37 2 60z"/>
          <rect x="78" y="178" width="6" height="22" rx="3"/>
        </g>
        <g class="sway b" fill="#346b4f">
          <path d="M720 185 c-6 -22 8 -48 18 -64 10 -16 12 -32 6 -44 -6 -12 12 -14 18 -1 7 13 7 28 0 44 -7 16 -5 40 3 65z"/>
          <rect x="718" y="183" width="6" height="22" rx="3"/>
        </g>
        <g class="sway c" fill="#2f5a41">
          <path d="M380 182 c-3 -14 2 -32 8 -44 6 -12 7 -24 3 -33 -5 -9 9 -11 13 0 5 9 5 21 0 33 -4 12 -3 29 2 44z"/>
          <rect x="378" y="180" width="5" height="18" rx="2.5"/>
        </g>
      </svg>
    </div>
  </main>

  <!-- Reduced-motion preference handled by CSS only; no JS needed -->
</body>
</html>
